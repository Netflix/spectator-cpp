[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "spectator-py-cpp"
version = "0.1.0"
description = "Python bindings for spectator-cpp — high-performance Netflix metrics client"
requires-python = ">=3.8"

[tool.scikit-build]
cmake.build-type = "Release"
